<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Project Status</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" id="brand" href="#" target="_blank" rel="noopener">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span id="owner-name"></span>
      </a>
      <button class="btn-ghost" id="refresh" type="button" hidden>
        <span aria-hidden="true">↻</span> Refresh
      </button>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="state" id="state" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading project status…</p>
    </section>

    <div id="dashboard" hidden>
      <section class="hero card">
        <div class="hero-main">
          <p class="eyebrow" id="client-name"></p>
          <h1 id="project-name"></h1>
          <span class="pill" id="project-health"></span>
          <p class="summary" id="project-summary"></p>
        </div>

        <div class="progress-block">
          <div class="ring" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" id="progress-bar">
            <div class="ring-face">
              <strong id="progress-percent">0%</strong>
              <span>complete</span>
            </div>
          </div>
          <p class="muted small" id="progress-count"></p>
        </div>

        <dl class="stats">
          <div><dt>Started</dt><dd id="start-date">—</dd></div>
          <div><dt>Deadline</dt><dd id="deadline">—</dd></div>
          <div><dt>Time left</dt><dd id="days-left">—</dd></div>
        </dl>
      </section>

      <div class="columns">
        <section class="card" aria-labelledby="tasks-title">
          <h2 id="tasks-title">Tasks</h2>
          <div id="task-groups"></div>
        </section>

        <section class="card" aria-labelledby="updates-title">
          <h2 id="updates-title">Latest updates</h2>
          <ol class="timeline" id="updates"></ol>
        </section>
      </div>

      <p class="footer muted small" id="last-updated"></p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="lib.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
